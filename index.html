<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 1: Luxury Clean Gold</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeInUp 0.8s ease forwards; }
        .gold-glow:hover { box-shadow: 0 10px 25px -5px rgba(234, 179, 8, 0.4); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-xl w-full bg-white rounded-[32px] p-8 shadow-[0_20px_50px_rgba(0,0,0,0.04)] border border-slate-100 text-center animate-fade-up">
        <span class="text-amber-600 tracking-[0.3em] font-bold text-xs uppercase block mb-3">✨ PREMIUM CONCEPT</span>
        <h1 class="text-4xl font-black tracking-tight text-slate-900 mb-4">Hạ Linh Premium Hotel</h1>
        <p class="text-slate-500 italic mb-8 text-sm">"Nghỉ ngơi êm ái - Trọn vẹn niềm vui"</p>
        
        <div class="border border-slate-100 rounded-2xl overflow-hidden group bg-slate-50/50 transition-all duration-300 hover:bg-white hover:shadow-xl hover:-translate-y-1">
            <div class="h-48 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=600')"></div>
            <div class="p-6 text-left">
                <h3 class="text-xl font-bold text-slate-900 group-hover:text-amber-600 transition-colors">Full Moon (Trăng Tròn)</h3>
                <p class="text-xs text-amber-600 font-bold mt-1">Phòng Gia Đình - 2 Giường Đôi</p>
                <div class="mt-6 flex justify-between items-center">
                    <span class="text-slate-400 text-sm">👥 4 Người lớn</span>
                    <button class="bg-amber-500 text-white font-bold text-xs px-6 py-3 rounded-xl transition-all duration-300 gold-glow hover:bg-amber-600 uppercase tracking-wider">Đặt Ngay</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
