<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 4: Glassmorphism Frosted</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.6); }
        .shine-effect { position: relative; overflow: hidden; }
        .shine-effect::after { content: ''; position: absolute; top: -50%; left: -60%; width: 30%; height: 200%; background: rgba(255,255,255,0.4); transform: rotate(30deg); transition: 0.7s; opacity: 0; }
        .shine-effect:hover::after { left: 130%; opacity: 1; }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-100 via-sky-100 to-purple-100 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-xl w-full glass-panel rounded-[35px] p-8 shadow-2xl text-center">
        <h1 class="text-3xl font-black text-slate-900 tracking-tight uppercase mb-2">Hạ Linh Bãi Sau</h1>
        <div class="w-12 h-1 bg-gradient-to-r from-sky-400 to-amber-400 mx-auto mb-6 rounded-full"></div>
        
        <div class="glass-panel rounded-2xl p-4 text-left shadow-sm shine-effect bg-white/30 cursor-pointer">
            <img src="https://images.unsplash.com/photo-1591088398332-8a7791972843?w=600" class="w-full h-44 object-cover rounded-xl mb-4">
            <h3 class="text-lg font-bold text-slate-800">Half Moon Room</h3>
            <p class="text-xs text-slate-600 mt-1">Ban công ngắm trọn bình minh Bãi Sau siêu thơ mộng.</p>
            <div class="mt-4 pt-3 border-t border-white/40 flex justify-between items-center">
                <span class="text-slate-700 text-sm font-bold">📐 28m²</span>
                <span class="text-sm font-black bg-white/80 px-3 py-1.5 rounded-lg text-slate-900 shadow-sm">280.000đ</span>
            </div>
        </div>
    </div>
</body>
</html>
