<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 5: Tech Lab White</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    </style>
</head>
<body class="bg-white text-slate-900 font-sans min-h-screen flex flex-col items-center justify-center p-6 tracking-wide">
    <div class="max-w-xl w-full border border-slate-200 rounded-2xl p-8 shadow-[0_4px_30px_rgba(0,0,0,0.02)] relative">
        <div class="flex justify-between items-center mb-8 border-b border-slate-100 pb-4">
            <div>
                <h1 class="text-2xl font-light tracking-widest text-slate-900 uppercase font-serif">HA LINH <span class="font-bold">LUNAR</span></h1>
                <p class="text-[10px] text-slate-400 font-mono mt-0.5">LATITUDE: 10.3460° N // LONGITUDE: 107.0850° E</p>
            </div>
            <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 pulse-slow"></div>
        </div>

        <div class="border border-slate-100 rounded-xl overflow-hidden group transition-all duration-500 hover:border-slate-400">
            <div class="overflow-hidden h-44 relative">
                <img src="https://images.unsplash.com/photo-1582719478250-c89cae4df85b?w=600" class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-110">
            </div>
            <div class="p-5">
                <div class="text-[10px] font-mono text-slate-400 mb-1">UNIT_CODE // 003</div>
                <h3 class="text-base font-bold tracking-tight text-slate-900">Full Moon Family Pod</h3>
                <div class="mt-6 flex justify-between items-end">
                    <span class="text-xs text-slate-400 font-mono">STATUS: AVAILABLE</span>
                    <button class="bg-slate-900 text-white font-mono text-xs px-4 py-2.5 rounded-md hover:bg-slate-800 transition-colors uppercase tracking-wider">INITIATE BOOK</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
