<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 2: Light Cyber Neon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .cyber-grid { background-image: linear-gradient(rgba(6, 182, 212, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(6, 182, 212, 0.05) 1px, transparent 1px); background-size: 20px 20px; }
        @keyframes pulseBorder {
            0%, 100% { border-color: rgba(6, 182, 212, 0.3); }
            50% { border-color: rgba(168, 85, 247, 0.8); }
        }
        .animate-cyber-border { animation: pulseBorder 3s infinite; }
    </style>
</head>
<body class="cyber-grid bg-slate-100 text-slate-900 font-mono min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-xl w-full bg-white/90 border-2 border-cyan-500 rounded-none p-8 shadow-[0_0_30px_rgba(6,182,212,0.15)] relative overflow-hidden">
        <div class="absolute top-0 left-0 w-3 h-3 bg-cyan-500"></div>
        <div class="absolute bottom-0 right-0 w-3 h-3 bg-purple-500"></div>
        
        <span class="text-cyan-600 font-black text-xs tracking-widest block mb-2">[ SYSTEM: ACTIVE ]</span>
        <h1 class="text-3xl font-black uppercase tracking-tighter mb-4 text-transparent bg-clip-text bg-gradient-to-r from-cyan-600 to-purple-600">HA LINH HOTEL // NEXT-GEN</h1>
        
        <div class="border border-cyan-200 p-4 bg-white transition-all duration-300 hover:shadow-[0_0_20px_rgba(168,85,247,0.2)] hover:border-purple-500 group mt-6">
            <div class="h-40 bg-slate-200 relative overflow-hidden">
                <div class="absolute inset-0 bg-cyan-500/10 z-10 mix-blend-overlay"></div>
                <img src="https://images.unsplash.com/photo-1566665797739-1674de7a421a?w=600" class="w-full h-full object-cover">
            </div>
            <div class="mt-4 text-left">
                <div class="flex justify-between items-start">
                    <h3 class="text-lg font-black uppercase text-slate-800">ECLIPSE SUITE</h3>
                    <span class="text-xs bg-purple-100 text-purple-700 font-bold px-2 py-0.5">LEVEL_VIP</span>
                </div>
                <div class="mt-6 flex justify-between items-center border-t border-dashed border-slate-200 pt-4">
                    <span class="text-slate-500 text-xs">// PLATFORM: 40m²</span>
                    <button class="bg-slate-900 text-cyan-400 font-bold text-xs px-4 py-2 border border-cyan-400 hover:bg-cyan-500 hover:text-white transition-all duration-200 uppercase tracking-widest">Execute Book</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
